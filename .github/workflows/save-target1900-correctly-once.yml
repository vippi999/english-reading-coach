name: Save Target 1900 cards correctly once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/save-target1900-correctly-once.yml

permissions:
  contents: write

jobs:
  save:
    if: github.event.head_commit.message == 'Save Target 1900 cards correctly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save cards and completion
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          today = '2026-08-19'
          book = 'ターゲット1900'
          unit = ''

          items = [
            ('target1900-place-put','動詞のplaceはほぼputの意','tip','動詞のplaceはほぼputの意','place','She placed the book on the desk.','彼女はその本を机の上に置いた。'),
            ('target1900-give-gave','giveの過去形はgave','tip','giveの過去形はgave','gave','She gave me a book.','彼女は私に本をくれた。'),
            ('target1900-give-thought','give thought ：考慮する','term','考慮する','give thought','We should give thought to the cost.','私たちは費用を考慮すべきだ。'),
            ('target1900-enjoy-benefit','enjoy：享受する！！！！！！！！','term','享受する！！！！！！！！','enjoy','Many people enjoy the benefits of technology.','多くの人が技術の恩恵を享受している。'),
            ('target1900-practice-put-do','practiceはputする 実行する','tip','practiceはputする 実行する','practice','They put the plan into practice.','彼らはその計画を実行した。'),
            ('target1900-role-play','roleはplayする 役割を果たす','tip','roleはplayする 役割を果たす','role','Education plays an important role in society.','教育は社会で重要な役割を果たす。'),
            ('target1900-imperative-subject-omission','命令文は主語を省く','tip','命令文は主語を省く','命令文','Open the window.','窓を開けなさい。'),
            ('target1900-something-subject','somethingは主語になる','tip','somethingは主語になる','something','Something has changed.','何かが変わった。'),
            ('target1900-time-conjunction','〜timeで接続詞になることがあるを','tip','〜timeで接続詞になることがあるを','time','Every time I see him, he smiles.','彼に会うたびに、彼は笑う。'),
            ('target1900-long-object-preposition-order','svo前置詞は、Oが長いと先に前置詞がくる。','tip','svo前置詞は、Oが長いと先に前置詞がくる。','svo前置詞','She explained to me what had happened.','彼女は何が起きたのかを私に説明した。'),
            ('target1900-people-who-those-who','people who=those who','tip','people who=those who','people who=those who','Those who work hard often improve.','努力する人々はよく上達する。'),
            ('target1900-much-as-concession','much as sv  どんなに〜しても','tip','much as sv  どんなに〜しても','much as sv','Much as I wanted to go, I stayed home.','どんなに行きたくても、私は家にいた。'),
            ('target1900-sharp-rise','sharp rise 急上昇','tip','sharp rise 急上昇','sharp rise','There was a sharp rise in prices.','価格が急上昇した。'),
            ('target1900-process-processing','processは処理という意味もある','tip','processは処理という意味もある','process','The computer processes the data quickly.','そのコンピューターはデータを素早く処理する。'),
          ]

          review_path = Path('review_items.json')
          review = json.loads(review_path.read_text(encoding='utf-8'))
          existing = {x.get('id') for x in review.get('items', [])}
          additions = []
          for ident, raw, cat, answer, excerpt, en, ja in items:
            if ident in existing:
              continue
            if cat == 'term':
              left, right = raw.replace(' ：', '：').split('：', 1)
              prompt = left
              card_sentence = {'before': left + '：', 'hidden': right, 'after': ''}
              target = left
            else:
              prompt = raw
              card_sentence = {'before': '', 'hidden': raw, 'after': ''}
              target = raw
            additions.append({
              'id': ident,
              'source': {'book': book, 'unit': unit, 'location': '', 'excerpt': excerpt},
              'target': target,
              'category': cat,
              'prompt': prompt,
              'answer_core': answer,
              'usage_examples': [{'english': en, 'japanese': ja}],
              'card_sentence': card_sentence,
              'created_at': today,
              'learned_on': today
            })
          review.setdefault('items', []).extend(additions)
          review_path.write_text(json.dumps(review, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          seed_path = Path('study_seed.json')
          seed = json.loads(seed_path.read_text(encoding='utf-8'))
          completed = seed.setdefault('completedLessons', [])
          found = False
          for row in completed:
            if row.get('book') == book and row.get('unit', '') == unit:
              row.update({'completedOn': today, 'status': 'completed'})
              found = True
              break
          if not found:
            completed.append({'book': book, 'unit': unit, 'completedOn': today, 'status': 'completed'})
          seed_path.write_text(json.dumps(seed, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          Path('カード候補.md').write_text('# カード候補\n\n実践チャットが「カードにして」と言われた候補の一時置き場です。\n保存後、保存済み候補は削除します。\n\n## 語句\n\n## コツ\n', encoding='utf-8')
          PY
      - name: Commit saved data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review_items.json study_seed.json カード候補.md
          git commit -m "ターゲット1900のカードを正しく保存"
          git push
