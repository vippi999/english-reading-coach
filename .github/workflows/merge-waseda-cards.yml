name: Merge Waseda cards
on:
  push:
    branches: [tmp-merge-waseda-2024-iii-3]
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Merge cards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('review_items.json')
          old=json.loads(p.read_text(encoding='utf-8'))
          new=json.loads(Path('.tmp_new_cards.json').read_text(encoding='utf-8'))
          existing={x.get('id') for x in old.get('items',[])}
          old['items'].extend(x for x in new.get('items',[]) if x.get('id') not in existing)
          p.write_text(json.dumps(old, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          rm .tmp_new_cards.json
          rm .github/workflows/merge-waseda-cards.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Merge Waseda 2024 III reading cards"
          git push
