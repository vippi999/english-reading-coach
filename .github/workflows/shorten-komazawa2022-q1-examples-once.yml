name: Shorten Komazawa 2022 Q1 examples once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/shorten-komazawa2022-q1-examples-once.yml

permissions:
  contents: write

jobs:
  shorten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('review_items.json')
          data = json.loads(p.read_text(encoding='utf-8'))

          replacements = {
            'komazawa2022-q1-ever-since': (
              'Ever since Japanese woodblock prints were introduced to Europe and America',
              '日本の木版画がヨーロッパとアメリカに紹介されて以来ずっと'
            ),
            'komazawa2022-q1-serious': (
              'they were not collected seriously',
              'それらは本格的には収集されなかった'
            ),
            'komazawa2022-q1-originally': (
              'prints were originally mass-produced and cheap',
              '版画はもともと大量生産され、安価だった'
            ),
            'komazawa2022-q1-although-concession': (
              'although the finest prints can now cost large sums of money',
              '最上級の版画は今では多額の金がかかることもあるが'
            ),
            'komazawa2022-q1-large-sums-of-money': (
              'cost large sums of money',
              '多額の金がかかる'
            ),
            'komazawa2022-q1-relative-clause-return-main': (
              'prints, which are still relatively cheap, because they continue to reveal ...',
              '版画はまだ比較的安価で、しかも…を示し続けているため'
            ),
            'komazawa2022-q1-you-can-imagine-emphasis': (
              'every subject you could imagine',
              '考えられるあらゆる題材'
            ),
          }

          changed = 0
          for item in data.get('items', []):
            rid = item.get('id')
            if rid not in replacements:
              continue
            en, ja = replacements[rid]
            item.setdefault('source', {})['excerpt'] = en
            item['usage_examples'] = [{'english': en, 'japanese': ja}]
            changed += 1

          if changed != len(replacements):
            raise SystemExit(f'expected {len(replacements)} cards, changed {changed}')

          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          rm .github/workflows/shorten-komazawa2022-q1-examples-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add review_items.json .github/workflows/shorten-komazawa2022-q1-examples-once.yml
          git commit -m '駒澤大学2022 問題1の例文を短縮'
          git push
