name: Save Target 1900 found separate encourage once
on:
  push:
    branches: [main]
    paths: [.github/workflows/save-target1900-20260823-found-separate-encourage-once.yml]
permissions:
  contents: write
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('review_items.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          items = data.setdefault('items', [])
          existing = {x.get('id') for x in items}

          cards = [
            {
              'id':'target1900-found-two-forms',
              'source':{'book':'ターゲット1900','unit':'','location':'','excerpt':'found / founded / found'},
              'target':'foundは、findの過去分詞形でもあり、設立するという動詞でもある',
              'category':'tip',
              'prompt':'foundは、findの過去分詞形でもあり、設立するという動詞でもある',
              'answer_core':'findの過去分詞形でもあり、設立するという動詞でもある',
              'usage_examples':[{'english':'The company was founded in 1990; the missing file was found later.','japanese':'その会社は1990年に設立され、なくなっていたファイルは後で見つかった。'}],
              'card_sentence':{'before':'foundは、','hidden':'findの過去分詞形でもあり、設立するという動詞でもある','after':''},
              'created_at':'2026-08-23','learned_on':'2026-08-23'
            },
            {
              'id':'target1900-separate-part',
              'source':{'book':'ターゲット1900','unit':'','location':'','excerpt':'separate'},
              'target':'separate：別れる',
              'category':'term',
              'prompt':'separate：別れる',
              'answer_core':'別れる',
              'usage_examples':[{'english':'The two paths separate here.','japanese':'2つの道はここで分かれる。'}],
              'card_sentence':{'before':'separate：','hidden':'別れる','after':''},
              'created_at':'2026-08-23','learned_on':'2026-08-23'
            },
            {
              'id':'target1900-encourage-promote',
              'source':{'book':'ターゲット1900','unit':'','location':'','excerpt':'encourage'},
              'target':'encourage：奨励する',
              'category':'term',
              'prompt':'encourage：奨励する',
              'answer_core':'奨励する',
              'usage_examples':[{'english':'Teachers encourage students to ask questions.','japanese':'教師は生徒に質問するよう奨励する。'}],
              'card_sentence':{'before':'encourage：','hidden':'奨励する','after':''},
              'created_at':'2026-08-23','learned_on':'2026-08-23'
            }
          ]
          for card in cards:
              if card['id'] not in existing:
                  items.append(card)
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          cp = Path('カード候補.md')
          if cp.exists():
              text = cp.read_text(encoding='utf-8')
              for s in [
                  'foundは、findの過去分詞形でもあり、設立するという動詞でもある',
                  'foundは、findの過去分詞形でもあり、設立するどう言う動詞でもある',
                  'separate：別れる',
                  'encourage：奨励する'
              ]:
                  text = text.replace(s+'\n','').replace(s,'')
              cp.write_text(text, encoding='utf-8')

          wf = Path('.github/workflows/save-target1900-20260823-found-separate-encourage-once.yml')
          if wf.exists(): wf.unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add review_items.json カード候補.md .github/workflows/save-target1900-20260823-found-separate-encourage-once.yml
          git commit -m 'ターゲット1900にfound separate encourageを保存'
          git push
