name: Save 全統模試 cards once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/save-zento-moshi-20260728-once.yml

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save cards
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          review_path = Path('review_items.json')
          data = json.loads(review_path.read_text(encoding='utf-8'))
          items = data.setdefault('items', [])
          existing = {x.get('id') for x in items}

          def card(id_, target, category, before, hidden, after, en, ja, excerpt=''):
              return {
                'id': id_,
                'source': {'book':'全統模試','unit':'','location':'','excerpt':excerpt},
                'target': target,
                'category': category,
                'prompt': target,
                'answer_core': hidden,
                'usage_examples': [{'english': en, 'japanese': ja}],
                'card_sentence': {'before': before, 'hidden': hidden, 'after': after},
                'created_at': '2026-07-28',
                'learned_on': '2026-07-28'
              }

          cards = [
            card('zento-20260728-progressive-future','予定を表す進行形がある','tip','予定を表す','進行形がある','。','I am meeting her tomorrow.','私は明日彼女に会う予定です。'),
            card('zento-20260728-either-family','eitherは、文法的にboth 、not only とかと似てる部類','tip','eitherは、文法的に','both 、not only とかと似てる部類','。','Either answer is possible.','どちらの答えもあり得ます。'),
            card('zento-20260728-since-reason','sinceは当たり前の理由とかを述べる時に使う','tip','sinceは','当たり前の理由とかを述べる時に使う','。','Since you are here, we can start.','あなたがここにいるので、始められます。'),
            card('zento-20260728-rest-of-you','the rest of you：のこったあなた','term','the rest of you：','のこったあなた','','The rest of you can wait here.','残りのあなたたちはここで待てます。','the rest of you'),
            card('zento-20260728-make-causation','makeは因果','tip','makeは','因果','。','The news made me happy.','その知らせで私はうれしくなりました。'),
            card('zento-20260728-in-adverb-bring-in','inには副詞があり、bring inは、その1例','tip','inには副詞があり、bring inは、','その1例','。','Please bring the chair in.','その椅子を中に持ってきてください。','bring in'),
            card('zento-20260728-want-svoc','wantはsvocになる','tip','wantは','svocになる','。','I want you to come.','私はあなたに来てほしいです。'),
            card('zento-20260728-would-like-want','would likeはwantで一語として考えれる','tip','would likeは','wantで一語として考えれる','。','I would like some water.','私は水が欲しいです。'),
            card('zento-20260728-be-to','be動詞 toは、svcで、ただの名詞的用法になるか、be to構文になるか','tip','be動詞 toは、svcで、','ただの名詞的用法になるか、be to構文になるか','。','My goal is to study abroad.','私の目標は留学することです。'),
            card('zento-20260728-far-comparative','farは比較級を強調できる。','tip','farは','比較級を強調できる','。','This book is far better.','この本のほうがはるかに良いです。'),
            card('zento-20260728-confirm','confirm：裏付ける','term','confirm：','裏付ける','','The data confirmed the theory.','そのデータは理論を裏付けました。','confirm'),
            card('zento-20260728-in-terms-of','In terms of：関して言えば','term','In terms of：','関して言えば','','In terms of cost, this is better.','費用に関して言えば、こちらのほうがよいです。','In terms of'),
            card('zento-20260728-improvements','improvements：改善','term','improvements：','改善','','We saw major improvements.','大きな改善が見られました。','improvements'),
            card('zento-20260728-60s-age','60sは、60代','tip','60sは、','60代','。','He is in his 60s.','彼は60代です。','60s'),
            card('zento-20260728-there-are-coordinate-omission','There areを等位で繋ぐとき、2個目が省略されてnotから始まることがよくある。','tip','There areを等位で繋ぐとき、','2個目が省略されてnotから始まることがよくある','。','There are many books, but not many chairs.','本はたくさんありますが、椅子は多くありません。'),
            card('zento-20260728-days-away','days away：あと数日','term','days away：','あと数日','','The exam is only two days away.','試験まであと2日です。','days away'),
            card('zento-20260728-remember-being','remember beingは過去を覚えている','tip','remember beingは','過去を覚えている','。','I remember being nervous.','緊張していたことを覚えています。','remember being'),
            card('zento-20260728-adverb-that-degree','thatの後に文が来なくて形容詞とかが来てたら副詞のthatで、それほど','tip','thatの後に文が来なくて形容詞とかが来てたら','副詞のthatで、それほど','。','It is not that difficult.','それほど難しくありません。'),
            card('zento-20260728-blankly','blankly：ぼんやり','term','blankly：','ぼんやり','','He stared blankly at the wall.','彼は壁をぼんやり見つめました。','blankly'),
            card('zento-20260728-them-things','themは物も入る意識','tip','themは','物も入る意識','。','I bought the books and read them.','私はその本を買って、それらを読みました。','them'),
            card('zento-20260728-it-plural-they','itの複数形はthey','tip','itの複数形は','they','。','It is useful, and they are useful too.','それは役立ち、それらも役立ちます。'),
            card('zento-20260728-could-suggestion','could提案に使う','tip','could','提案に使う','。','You could ask her.','彼女に聞いてみてもよいでしょう。','could'),
            card('zento-20260728-forecast-say','forecastはsayする','tip','forecastは','sayする','。','The forecast says it will rain.','予報では雨が降ると言っています。','forecast'),
            card('zento-20260728-final-though-but','文末のthoughは、付け足しのbut','tip','文末のthoughは、','付け足しのbut','。','It was expensive. I liked it, though.','高かったです。でも気に入りました。','though'),
            card('zento-20260728-itll-be-fine','it\'ll be fine：大丈夫なんちゃう','term','it\'ll be fine：','大丈夫なんちゃう','','It\'ll be fine.','大丈夫なんちゃう。','it\'ll be fine'),
            card('zento-20260728-by-the-time','by the timeでsvが続く副詞節。その時までには','tip','by the timeでsvが続く副詞節。','その時までには','。','By the time you arrive, I will be ready.','あなたが着くころまでには、準備できています。','by the time'),
            card('zento-20260728-tell-distinguish','tellの後に人がなかったら見分けると訳す','tip','tellの後に人がなかったら','見分けると訳す','。','I cannot tell the difference.','その違いを見分けられません。','tell'),
            card('zento-20260728-hit-success','hit：大成功','term','hit：','大成功','','The movie was a big hit.','その映画は大成功でした。','hit')
          ]

          for c in cards:
              if c['id'] not in existing:
                  items.append(c)

          review_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          seed_path = Path('study_seed.json')
          seed = json.loads(seed_path.read_text(encoding='utf-8'))
          completed = seed.setdefault('completedLessons', [])
          found = False
          for row in completed:
              if row.get('book') == '全統模試' and row.get('unit','') == '':
                  row['completedOn'] = '2026-07-28'
                  row['status'] = 'completed'
                  found = True
                  break
          if not found:
              completed.append({'book':'全統模試','unit':'','completedOn':'2026-07-28','status':'completed'})
          seed_path.write_text(json.dumps(seed, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          candidate_path = Path('カード候補.md')
          candidate_path.write_text('# カード候補\n\n実践チャットが「カードにして」と言われた候補の一時置き場です。\n保存後、保存済み候補は削除します。\n\n## 語句\n\n## コツ\n', encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review_items.json study_seed.json カード候補.md
          git commit -m "全統模試 2026-07-28 を保存"
          git push
