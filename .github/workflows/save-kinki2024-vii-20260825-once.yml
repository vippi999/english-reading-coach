              'target':'限定のforで、期間を限定','category':'tip','prompt':'限定のforで、期間を限定','answer_core':'期間を限定',
              'usage_examples':[{'english':'For several years, industry expansion was limited mostly to penny candy sales.','japanese':'数年間、業界の拡大は主として1ペニー菓子の販売に限られていた。'}],
              'card_sentence':{'before':'限定のforで、','hidden':'期間を限定','after':''},'created_at':'2026-08-25','learned_on':'2026-08-25'
