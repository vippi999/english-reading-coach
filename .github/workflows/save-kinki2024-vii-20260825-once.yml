              'target':'to不定詞の受動態も当たり前にある','category':'tip','prompt':'to不定詞の受動態も当たり前にある','answer_core':'受動態も当たり前にある',
              'usage_examples':[{'english':'For the next two decades, vending machines continued to be used mainly in factories.','japanese':'その後20年間、自動販売機は主に工場で使われ続けた。'}],
