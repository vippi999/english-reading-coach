              'usage_examples':[{'english':'Sometimes there may be a service charge to the property owner, but often there is no cost.','japanese':'場合によっては土地の所有者にサービス料がかかることもあるが、費用がかからないことも多い。'}],
              'card_sentence':{'before':'there構文に助動詞が入ると ','hidden':'there may be とかになる','after':''},'created_at':'2026-08-25','learned_on':'2026-08-25'
            }
          ]

          for card in cards:
              if card['id'] not in existing:
                  items.append(card)

          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sp = Path('study_seed.json')
          seed = json.loads(sp.read_text(encoding='utf-8'))
          done = seed.setdefault('completedLessons', [])
          if not any(x.get('book') == '近畿大学 2024' and x.get('unit') == 'VII' for x in done):
              done.append({'book':'近畿大学 2024','unit':'VII','completedOn':'2026-08-25','status':'completed'})
          sp.write_text(json.dumps(seed, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          wp = Path('weakness_data.md')
          text = wp.read_text(encoding='utf-8')
          row = '| 2026-08-25 | 近畿大学 2024・VII | 自動販売機本文 p.12-13 | vend／for currency／century／devise／to不定詞／string／OCの受動関係／plug／tie／名詞use／get／otherwise／for／penny／figure／practical⇔ideal／to不定詞受動態／there＋助動詞。 |\n'
          if row not in text:
              text = text.rstrip() + '\n' + row
              wp.write_text(text, encoding='utf-8')

          cp = Path('カード候補.md')
          if cp.exists():
              text = cp.read_text(encoding='utf-8')
              targets = [c['target'] for c in cards]
              targets += ['there構文じょ同士が入ると there may be とかになる','there構文助動詞が入ると there may be とかになる']
              for s in targets:
                  text = text.replace(s+'\n','').replace(s,'')
              cp.write_text(text, encoding='utf-8')

          wf = Path('.github/workflows/save-kinki2024-vii-20260825-once.yml')
          if wf.exists(): wf.unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add review_items.json study_seed.json weakness_data.md カード候補.md .github/workflows/save-kinki2024-vii-20260825-once.yml
          git commit -m '近畿大学2024 VIIの読解カードを保存'
          git push
