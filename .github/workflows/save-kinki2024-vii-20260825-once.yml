              'target':'otherwise：そうでなければ','category':'term','prompt':'otherwise：そうでなければ','answer_core':'そうでなければ',
              'usage_examples':[{'english':'Another early purpose was for retailers to get their products, such as chewing gum, into places they could not otherwise sell.','japanese':'別の初期の目的は、小売業者がチューインガムなどの商品を、そうでなければ販売できない場所へ届けることだった。'}],
