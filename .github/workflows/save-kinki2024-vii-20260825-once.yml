              'usage_examples':[{'english':'Managers in factories figured people could not work the required long shifts without a refreshment break.','japanese':'工場の管理者たちは、人々は休憩なしでは必要な長時間勤務をこなせないと判断した。'}],
              'card_sentence':{'before':'figure 動詞：','hidden':'判断する','after':''},'created_at':'2026-08-25','learned_on':'2026-08-25'
